<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>nuqe.lol</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter;
}

body {
  background: #07070d;
  overflow: hidden;
  color: white;
}

/* ===== WEBGL CANVAS ===== */
#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* ===== UI WRAPPER ===== */
.wrapper {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== GLASS CARD ===== */
.card {
  width: 420px;
  padding: 22px;
  border-radius: 22px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow: 0 0 70px rgba(0,0,0,0.7);
  text-align: center;

  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.pfp {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  border: 2px solid #ff4fd8;
}

h1 {
  margin-top: 10px;
  font-size: 28px;
  font-weight: 900;
}

.bio {
  font-size: 13px;
  opacity: 0.7;
}

/* ===== STATUS ===== */
.status {
  margin-top: 10px;
  padding: 6px 12px;
  display: inline-block;
  border-radius: 999px;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.2);
}

/* ===== NOW PLAYING / CODING ===== */
.panel {
  margin-top: 12px;
  padding: 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 12px;
  text-align: left;
}

/* ===== LINKS ===== */
.links {
  margin-top: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

a {
  text-decoration: none;
  color: white;
  padding: 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  transition: 0.2s;
}

a:hover {
  transform: scale(1.04);
  background: rgba(255,79,216,0.18);
  border: 1px solid #ff4fd8;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrapper">
  <div class="card">

    <img class="pfp" src="pfp.webp">

    <h1>jamie.local</h1>
    <div class="bio">developer • systems • minecraft • tools</div>

    <div id="status" class="status">Loading...</div>

    <div id="activity" class="panel">Loading activity...</div>

    <div class="links">
      <a href="https://github.com/jamielocal">GitHub</a>
      <a href="https://modrinth.com/user/Jamiee">Modrinth</a>
      <a href="https://www.youtube.com/@jamiedoesnothing">YouTube</a>
    </div>

  </div>
</div>

<audio id="music" autoplay loop>
  <source src="https://github.com/simply-w93/simply-w93.github.io/raw/refs/heads/main/v4.mp3" type="audio/mp3">
</audio>

<script>
/* =========================
   DISCORD (LANYARD)
========================= */
const DISCORD_ID = "1214657865739149312";

async function load() {
  try {
    const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
    const data = await res.json();
    const d = data.data;

    const map = {
      online: "🟢 Online",
      idle: "🌙 Idle",
      dnd: "⛔ Do Not Disturb",
      offline: "⚫ Offline"
    };

    document.getElementById("status").innerText =
      map[d.discord_status] || "Unknown";

    const act = d.activities?.find(a => a.type !== 4);

    let text = "Idle";

    if (act) {
      if (act.name === "Spotify") {
        text = `🎵 Listening: ${act.details} — ${act.state}`;
      } else if (act.details) {
        text = `🎮 ${act.name}: ${act.details}`;
      } else {
        text = `💻 Using ${act.name}`;
      }
    }

    document.getElementById("activity").innerText = text;

  } catch {
    document.getElementById("status").innerText = "Offline";
  }
}

load();
setInterval(load, 5000);


/* =========================
   WEBGL SAKURA WIND STORM
   (GPU-like particle flow)
========================= */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

function init() {
  particles = [];
  for (let i = 0; i < 140; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: 0,
      vy: Math.random() * 1 + 0.5,
      r: Math.random() * 3 + 1,
      seed: Math.random() * 1000
    });
  }
}
init();

let t = 0;

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for (let p of particles) {

    // WIND FIELD (shader-like behavior)
    let windX = Math.sin((p.y * 0.005) + t) * 1.2;
    let windY = Math.cos((p.x * 0.005) + t) * 0.6;

    p.vx += windX * 0.02;
    p.vy += windY * 0.01;

    p.x += p.vx;
    p.y += p.vy;

    // damping (stability)
    p.vx *= 0.98;

    if (p.y > canvas.height) {
      p.y = -10;
      p.x = Math.random() * canvas.width;
    }

    if (p.x > canvas.width) p.x = 0;
    if (p.x < 0) p.x = canvas.width;

    ctx.fillStyle = "rgba(255,182,193,0.8)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  t += 0.01;
}

setInterval(draw, 16);

window.onresize = () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  init();
};
</script>

</body>
</html>

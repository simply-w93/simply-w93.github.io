<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="BetterBedrock Bypasser" />
    <meta property="og:description" content="This is why you dont vibe code kids" />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Bedrock Download Link Extractor</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 space-y-6">
        <h1 class="text-3xl font-bold text-gray-800 text-center">Better Bedrock Link Generator</h1>
        <p class="text-gray-600 text-center">
            Enter a Better Bedrock project preview link below to extract the direct download URL.
        </p>

        <!-- Input Field -->
        <div class="space-y-2">
            <label for="projectUrl" class="block text-sm font-medium text-gray-700">Project Preview Link</label>
            <input 
                type="url" 
                id="projectUrl" 
                value="https://betterbedrock.com/project/preview/dark_mode"
                placeholder="e.g., https://betterbedrock.com/project/preview/dark_mode"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500 transition duration-150"
            >
        </div>

        <!-- Action Button -->
        <button 
            id="fetchButton"
            onclick="getDownloadLink()"
            class="w-full flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg shadow-lg text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition duration-150 ease-in-out"
        >
            Get Download Link
        </button>

        <!-- Output Section -->
        <div id="outputContainer" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-2">Result:</h2>
            <div id="outputStatus" class="text-sm font-medium text-gray-500">Awaiting input...</div>
            
            <a id="downloadLink" href="#" target="_blank" class="block mt-3 break-all text-sky-600 hover:text-sky-800 underline transition duration-150 ease-in-out"></a>
        </div>
    </div>

    <script>
        // --- Configuration and State ---
        const API_BASE_URL = 'https://api.betterbedrock.com';
        const MAX_RETRIES = 3;
        const INITIAL_DELAY_MS = 1000;

        // DOM elements
        const urlInput = document.getElementById('projectUrl');
        const outputContainer = document.getElementById('outputContainer');
        const outputStatus = document.getElementById('outputStatus');
        const downloadLinkElement = document.getElementById('downloadLink');
        const fetchButton = document.getElementById('fetchButton');

        /**
         * Clears previous results and sets the current status message.
         * @param {string} message The status message to display.
         * @param {string} color Tailwind color class for the status message.
         */
        function setStatus(message, color = 'text-gray-500') {
            outputContainer.classList.remove('hidden');
            outputStatus.className = `text-sm font-medium ${color}`;
            outputStatus.textContent = message;
            downloadLinkElement.href = '#';
            downloadLinkElement.textContent = '';
        }

        /**
         * A wrapper around fetch with exponential backoff for retries.
         * @param {string} url The API URL to fetch.
         * @returns {Promise<Response>} The successful fetch response.
         */
        async function fetchWithRetry(url) {
            for (let i = 0; i < MAX_RETRIES; i++) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        // Throw error if response status is not 2xx
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.error(`Attempt ${i + 1} failed:`, error.message);
                    if (i === MAX_RETRIES - 1) {
                        throw new Error(`Failed to fetch after ${MAX_RETRIES} attempts.`);
                    }
                    // Calculate delay with exponential backoff and jitter
                    const delay = Math.pow(2, i) * INITIAL_DELAY_MS + Math.random() * 500;
                    console.log(`Retrying in ${delay.toFixed(0)}ms...`);
                    setStatus(`Attempt ${i + 1} failed. Retrying in ${delay.toFixed(0)}ms...`, 'text-yellow-600');
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        /**
         * Main function to get the download link.
         */
        async function getDownloadLink() {
            const url = urlInput.value.trim();
            fetchButton.disabled = true;
            fetchButton.textContent = 'Processing...';

            setStatus('Parsing URL and fetching data...', 'text-sky-600');
            
            try {
                // 1. Validate and parse the input URL
                const urlObject = new URL(url);
                const pathSegments = urlObject.pathname.split('/').filter(segment => segment.length > 0);
                
                // Expecting a path like /project/preview/ID
                if (pathSegments.length < 3) {
                    throw new Error('Invalid URL format. Expected format: /project/preview/ID');
                }

                // 2. Get the last part and set it as the ID
                const projectId = pathSegments[pathSegments.length - 1];
                
                // 3. Construct the project details API URL
                const detailsUrl = `${API_BASE_URL}/project/details/${projectId}`;
                console.log('Project ID:', projectId);
                console.log('Fetching details from:', detailsUrl);
                
                setStatus(`Found Project ID: ${projectId}. Fetching details...`, 'text-sky-600');

                // 4. Request the API
                const response = await fetchWithRetry(detailsUrl);
                
                // 5. Parse the JSON result
                const data = await response.json();
                
                // 6. Find "downloadFile" value
                const downloadFilePath = data.downloadFile;

                if (!downloadFilePath) {
                    throw new Error('The "downloadFile" field was not found in the API response.');
                }

                // 7. Construct the final download URL
                const finalDownloadUrl = `${API_BASE_URL}/${downloadFilePath}`;

                // 8. Display the final result
                setStatus('Success! Direct Download Link Found:', 'text-green-600');
                downloadLinkElement.href = finalDownloadUrl;
                downloadLinkElement.textContent = finalDownloadUrl;
                
            } catch (error) {
                console.error('Operation failed:', error);
                setStatus(`Error: ${error.message}`, 'text-red-600');
            } finally {
                fetchButton.disabled = false;
                fetchButton.textContent = 'Get Download Link';
            }
        }
    </script>

</body>
</html>
